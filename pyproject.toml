[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d2vi"
version = "2.0.0.dev6"
description = "D2VI (Detect, then Validly Infer): audit-based estimation of human-population quantities from AI-contaminated response data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nguyen Le" }, { name = "My Vu" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "pyarrow>=14",
]

[project.optional-dependencies]
text = ["vaderSentiment>=3.3", "textstat>=0.7", "nrclex>=4.0"]
gpu = ["torch>=2.1", "transformers>=4.40", "accelerate>=0.30", "bitsandbytes>=0.43"]
legacy = ["ppi-python>=0.2"]
survey = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "ruff>=0.4", "ppi-python>=0.2", "openpyxl>=3.1"]

[project.scripts]
d2vi-run = "d2vi.sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo tests that take more than a few seconds"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
