# Defaults chosen on development data in stage
# S4 on 2026-11-09, on both development corpora (Ghostbuster, HC3). To be frozen into
# configs/protocol/frozen.yaml with the git tag `protocol-freeze`. Evidence:
# results/S4_variance_dev_summary.csv, results/S4_design_dev_summary.csv,
# results/S4_tuning_dev_summary.csv, results/S4_explore_propensity_variance.csv,
# results/S4_policy_dev_regret.csv, results/S4_policy_dev_certification.csv.
audit:
  default_design: {name: proportional, n_strata: 10}   # S4 round 2 (S4b), see protocol 7
  compared: [srs, {name: proportional, n_strata: 10}, top_decile, {name: neyman, n_strata: 5},
             {name: adaptive, k_target: 16, cuts: [0.5, 0.8, 0.9], pilot_frac: 0.3,
              min_per_stratum: 2, min_second: 2}, pps]
  primary_budgets: [0.02, 0.05, 0.10]
  secondary_budgets: [0.01]
propensity:
  features: [score, loglen]
  n_folds: 5               # S4b: lower ITT error than 2 folds in 67% of cells, coverage
                           # unchanged, more often feasible
  c: 1.0                   # stronger regularisation did not help
  min_class: 4             # chosen over 6: better intention-to-treat accuracy, coverage kept
  min_class_fold: 2
power_tuning:
  clip: [0.0, 1.0]
variance:
  rule: model              # stratum variances shrunk (kappa = 1) to the variance anticipated
                           # under a Bernoulli origin model, Jeffreys stratum rates;
                           # Satterthwaite df. Chosen over lin, satt, pool, empirical-Bayes
                           # rates, floor; Rao-Wu explored and not adopted
  kappa: 1.0
  target_prior: jeffreys
  level: 0.95
fallback_when_infeasible: flag_ppi   # chosen over hajek (S4 policy run)
certification:
  test: tost
  alpha: 0.05
  tau_sd: 0.2              # substantive choice (Cohen's small effect); not tuned
  sensitivity_tau_sd: [0.1, 0.3]
  quantile: t              # Student quantile with the anchor's Satterthwaite df
  fallback: flag_ppi       # anchor when RC-PPI++ is infeasible
policy:
  bias_sq: debiased        # chosen over plugin: pooled sRMSE 0.052 vs 0.055, worst excess
                           # 0.189 vs 0.210 SD (results/S4_policy_dev_regret.csv)
  require_certification: false   # requiring TOST did not help (0.052, worst 0.193)
seed: 20261109
